# Neo4j cho phần Tổng quan (đồ thị dòng đời lô + mạng luân chuyển kho).
# SQL Server vẫn là nguồn sự thật; Neo4j chỉ là bản sao đọc, được GraphSyncWorker
# của backend dựng lại định kỳ từ SQL Server.
#
#   docker compose up -d
#   Trình duyệt Neo4j: http://localhost:7474  (user: neo4j / pass: neo4j_matkhau_manh)
#   Bolt cho backend:  bolt://localhost:7687
services:
  neo4j:
    image: neo4j:5.24-community
    container_name: vktb-neo4j
    ports:
      - "7474:7474"   # HTTP (trình duyệt Neo4j)
      - "7687:7687"   # Bolt (driver .NET)
    environment:
      NEO4J_AUTH: "neo4j/neo4j_matkhau_manh"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
